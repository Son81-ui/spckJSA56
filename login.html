
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TechStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>⚡ TechStore</h1>
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="signup.html">Đăng ký</a>
        </nav>
    </header>

    <main class="auth-container">
        <h2>Đăng nhập</h2>

        <form id="loginForm">
            <label for="loginUsername">Tên tài khoản</label>
            <input id="loginUsername" type="text"
                   required minlength="3" autocomplete="username">

            <label for="loginPassword">Mật khẩu</label>
            <input id="loginPassword" type="password"
                   required autocomplete="current-password">

            <p id="loginMessage" class="message"></p>
            <button type="submit">Đăng nhập</button>
        </form>

        <p>Chưa có tài khoản? <a href="signup.html">Đăng ký</a></p>
        <p><a href="index.html">← Quay lại cửa hàng</a></p>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
