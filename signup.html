
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - TechStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <a class="logo auth-logo" href="index.html">⚡ TechStore</a>

  <main class="auth-container">
    <h2>Tạo tài khoản</h2>
    <p>Đăng ký để khám phá TechStore.</p>

    <form id="signupForm">
      <label for="signupUsername">Tên tài khoản</label>
      <input id="signupUsername" type="text" required minlength="3"
        maxlength="30" placeholder="Ít nhất 3 ký tự"
        autocomplete="username">

      <label for="signupEmail">Email</label>
      <input id="signupEmail" type="email" required
        placeholder="ban@example.com" autocomplete="email">

      <label for="signupPassword">Mật khẩu</label>
      <input id="signupPassword" type="password" required minlength="6"
        placeholder="Ít nhất 6 ký tự" autocomplete="new-password">

      <label for="confirmPassword">Nhập lại mật khẩu</label>
      <input id="confirmPassword" type="password" required minlength="6"
        placeholder="Nhập lại mật khẩu" autocomplete="new-password">

      <p id="signupMessage" class="message" aria-live="polite"></p>
      <button class="btn" type="submit">Tạo tài khoản</button>
    </form>

    <p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
    <p><a href="index.html">← Quay lại cửa hàng</a></p>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
